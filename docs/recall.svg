<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
  </defs>

  <rect x="14" y="96" width="120" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="74" y="116" text-anchor="middle" font-size="13" fill="#6b7280">your prompt</text>
  <text x="74" y="133" text-anchor="middle" font-size="11" fill="#9ca3af">every turn</text>

  <line x1="136" y1="120" x2="170" y2="120" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="174" y="88" width="150" height="64" rx="8" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="1.6"/>
  <text x="249" y="112" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="600">the hook</text>
  <text x="249" y="129" text-anchor="middle" font-size="11" fill="#6b7280">keyword + meaning</text>
  <text x="249" y="143" text-anchor="middle" font-size="11" fill="#6b7280">matched, then fused</text>

  <line x1="326" y1="120" x2="360" y2="120" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="364" y="70" width="200" height="100" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="464" y="92" text-anchor="middle" font-size="13" fill="#6b7280" font-weight="600">5 pointers, not 5 documents</text>
  <text x="378" y="112" font-size="11" fill="#6b7280" font-family="ui-monospace, monospace">slug</text>
  <text x="378" y="128" font-size="11" fill="#6b7280" font-family="ui-monospace, monospace">one-line description</text>
  <text x="378" y="144" font-size="11" fill="#6b7280" font-family="ui-monospace, monospace">path to the file</text>
  <text x="464" y="162" text-anchor="middle" font-size="10.5" fill="#9ca3af">about 1.7k tokens, plus your rules</text>

  <line x1="566" y1="120" x2="600" y2="120" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="604" y="96" width="130" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="669" y="116" text-anchor="middle" font-size="13" fill="#6b7280">the agent opens</text>
  <text x="669" y="133" text-anchor="middle" font-size="11" fill="#9ca3af">the one or two it needs</text>

  <line x1="736" y1="120" x2="770" y2="120" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="774" y="96" width="112" height="48" rx="8" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="1.6"/>
  <text x="830" y="116" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="600">answers</text>
  <text x="830" y="133" text-anchor="middle" font-size="11" fill="#6b7280">with the fact, not a guess</text>

  <rect x="364" y="196" width="200" height="40" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="464" y="213" text-anchor="middle" font-size="11.5" fill="#6b7280">memory/  one markdown file per fact</text>
  <text x="464" y="228" text-anchor="middle" font-size="10.5" fill="#9ca3af">plain text, yours, on your disk</text>
  <line x1="464" y1="196" x2="464" y2="172" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4"/>

  <text x="450" y="34" text-anchor="middle" font-size="15" fill="#6b7280">Load small, recall deep. The memory grows without limit; the prompt does not.</text>
</svg>
