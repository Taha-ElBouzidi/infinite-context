<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
  </defs>

  <text x="18" y="26" font-size="12" fill="#6b7280" letter-spacing="1.5">LOCAL MODE</text>
  <rect x="18" y="40" width="380" height="230" rx="10" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="208" y="62" text-anchor="middle" font-size="12" fill="#6b7280">one machine, no network</text>
  <rect x="40" y="80" width="150" height="40" rx="7" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="1.4"/>
  <text x="115" y="104" text-anchor="middle" font-size="12" fill="#2563eb">the hook</text>
  <rect x="226" y="80" width="150" height="40" rx="7" fill="none" stroke="#6b7280" stroke-width="1.4"/>
  <text x="301" y="98" text-anchor="middle" font-size="12" fill="#6b7280">memory/ + index/</text>
  <text x="301" y="112" text-anchor="middle" font-size="10" fill="#9ca3af">markdown, on this disk</text>
  <line x1="192" y1="100" x2="222" y2="100" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="40" y="150" width="150" height="40" rx="7" fill="none" stroke="#6b7280" stroke-width="1.4"/>
  <text x="115" y="168" text-anchor="middle" font-size="12" fill="#6b7280">embedder</text>
  <text x="115" y="182" text-anchor="middle" font-size="10" fill="#9ca3af">127.0.0.1, started by the hook</text>
  <line x1="115" y1="122" x2="115" y2="146" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="208" y="228" text-anchor="middle" font-size="11" fill="#6b7280">about 190ms per prompt, 97.6% recall@5</text>
  <text x="208" y="246" text-anchor="middle" font-size="11" fill="#6b7280">works offline, two commands to install</text>

  <text x="480" y="26" font-size="12" fill="#6b7280" letter-spacing="1.5">MULTI-MACHINE MODE</text>
  <rect x="480" y="40" width="402" height="230" rx="10" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="681" y="62" text-anchor="middle" font-size="12" fill="#6b7280">a private network, scoped tokens</text>
  <rect x="600" y="80" width="160" height="70" rx="8" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="1.6"/>
  <text x="680" y="100" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="600">the host</text>
  <text x="680" y="116" text-anchor="middle" font-size="10" fill="#6b7280">memory/ + index/ + embedder</text>
  <text x="680" y="130" text-anchor="middle" font-size="10" fill="#6b7280">recall happens here</text>
  <text x="680" y="144" text-anchor="middle" font-size="10" fill="#6b7280">secrets encrypted per machine</text>
  <rect x="500" y="196" width="120" height="36" rx="7" fill="none" stroke="#6b7280" stroke-width="1.4"/>
  <text x="560" y="218" text-anchor="middle" font-size="11" fill="#6b7280">laptop</text>
  <rect x="740" y="196" width="130" height="36" rx="7" fill="none" stroke="#6b7280" stroke-width="1.4"/>
  <text x="805" y="212" text-anchor="middle" font-size="11" fill="#6b7280">restricted machine</text>
  <text x="805" y="226" text-anchor="middle" font-size="9.5" fill="#9ca3af">memory yes, vault never</text>
  <line x1="580" y1="194" x2="640" y2="152" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="790" y1="194" x2="725" y2="152" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="681" y="256" text-anchor="middle" font-size="11" fill="#6b7280">about 600ms over the network, same 97.6%</text>
</svg>
