name: CLA

# Every pull request must carry a signed Contributor Licence Agreement before it can merge.
# The project is AGPL-3.0 and is also offered under commercial licences, which is only possible
# if the owner can relicense every line. See CLA.md and CONTRIBUTING.md.
#
# Signatures are stored on a branch of this repository by the action itself, using the
# repository's own token. No external service, no extra secret.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/${{ github.repository }}/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: '${{ github.repository_owner }},dependabot[bot]'
