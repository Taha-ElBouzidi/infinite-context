    if (P.length===2){ ctx.lineTo(P[1].X,P[1].Y); return; }
    for (let i=1;i<P.length-1;i++){
      const xc=(P[i].X+P[i+1].X)/2, yc=(P[i].Y+P[i+1].Y)/2;
      ctx.quadraticCurveTo(P[i].X,P[i].Y,xc,yc);
    }
    const n=P.length;
    ctx.quadraticCurveTo(P[n-2].X,P[n-2].Y,P[n-1].X,P[n-1].Y);
    return;
  }
  // GROWING. The old version sliced the CONTROL POINTS, of which a bundled edge has three or
  // four, so a half-drawn link was a straight line from the node to a bundling hub deep inside
  // the sphere. Fifteen new links at once looked like gold girders thrown across the graph.
  // A link now grows along its own routed path, sampled, so it is a curve at every fraction.
  const segs = chainSegs(P);
  const N = 40, cut = Math.max(2, Math.round(N * grow));
  const per = N / segs.length;
  let k = 0;
  ctx.moveTo(P[0].X, P[0].Y);
  for (const [a,c,b] of segs){
    for (let i=1;i<=per;i++){
      if (++k > cut) return;
      const t = i/per, u = 1-t;
      ctx.lineTo(u*u*a.X + 2*u*t*c.X + t*t*b.X, u*u*a.Y + 2*u*t*c.Y + t*t*b.Y);
    }
  }
}

function drawNode(n,p,near,q,now){
  const dimmed = (near && !near.has(n)) || (q && !q.has(n.name));
  const r = Math.max(.7, n.r * p.d * (scale/430));
  n._X=p.X; n._Y=p.Y; n._R=r;

  // Creation: a memory that appeared since the page loaded arrives with a ring
  // and eases up to size, so a write to the brain is something you SEE.
  let birth = 1;
  if (n.born){
    const age = (now-n.born)/1400;
    if (age<1){
      birth = 0.2+0.8*ease(age);
      ring(p.X,p.Y, r*(2+age*10), hexa(C("--gold"), (1-age)*.75), 1.4);
    } else n.born = 0;
  }

  // Deletion, the mirror of creation. A memory removed from the brain contracts, goes cold and
  // closes a ring inward, and is gone from the graph for real when the animation ends. Before
  // this the page only ever ADDED: a deleted or renamed memory stayed on screen until reload,
  // and since a rename is a delete plus a create, renaming one left a permanent ghost with no
  // links. Gold opens, red closes.
  let fade = 1;
  if (n.dying){
    const age = Math.min(1, (now-n.dying)/DEATH_MS);
    fade = 1-ease(age);
    birth *= 1-ease(age)*0.72;
    ring(p.X,p.Y, r*(3.4-age*2.8), hexa(C("--stop"), (1-age)*.8), 1.4);
  }

  const a = (dimmed ? .13 : 1) * fade;
  const pulse = n.pulse;
  // Lit by a neighbour's recall: not pulsing itself, but the far end of a bright line.
  const tied = n._lit === S.litFrame && pulse <= 0;

  // Heat reads as light, not only as height. A bump is invisible when you are looking straight
  // down at it, so the same rank drives the bloom and the opacity: the hot ones burn, the cold
  // ones recede. h defaults to 0.5 for a node created since the last layout.
  const h = n._heat === undefined ? 0.5 : n._heat;
  if (!dimmed){
    const spread = r*(2.2 + h*3.0 + pulse*3 + (tied?1.4:0));
    paintBloom(p.X, p.Y, spread, n.dying ? C("--stop") : (pulse>0||tied)?C("--volt"):n.color,
      (.14 + h*.34 + pulse*.55 + (tied?.30:0))*p.d*fade);
  }
  ctx.beginPath(); ctx.arc(p.X,p.Y,Math.max(.4,r*birth),0,6.2832);
  ctx.fillStyle = hexa(n.dying ? C("--stop") : (pulse>0||tied) ? C("--volt2") : n.color,
    a*((.28 + h*.42) + p.d*.32) + (tied?.28:0));
  ctx.fill();
  // A thin ring on the far end, so the line ends on a mark rather than fading into the dot.
  if (tied) ring(p.X,p.Y, r+3, hexa(C("--volt"), .45), 0.9);

  // Recall: an expanding ring, once per hit. This is the brain being used.
  if (pulse>0){
    const k = 1-pulse;
    ring(p.X,p.Y, r+k*46, hexa(C("--volt"), pulse*.5), 0.9);
    if (k>.35) ring(p.X,p.Y, r+(k-.35)*46, hexa(C("--volt"), pulse*.24), 0.8);
  }
  if (n===(S.hover||S.selected)) ring(p.X,p.Y, r+6, C("--ink"), 1.3);
}

function drawSats(now){
  if (!S.sats.length) return;
  const parent = S.sats[0].parent;
  for (const s of S.sats){
    const t = Math.min(1,(now-s.born)/900), e = ease(t);
    const sp = S.t*s.spin + s.phase, cs=Math.cos(sp), sn=Math.sin(sp);
    const ox = s.ox*cs - s.oz*sn, oz = s.ox*sn + s.oz*cs;
    const c0 = wp(parent);
    const P = project({ x:c0.x+ox*s.rr*e, y:c0.y+s.oy*s.rr*e, z:c0.z+oz*s.rr*e });
    ctx.beginPath(); ctx.arc(P.X,P.Y, Math.max(.6, 1.9*P.d), 0, 6.2832);
    ctx.fillStyle = hexa(parent.color, .52*e*P.d+.18);
    ctx.fill();
  }
}

function drawHubLabels(){
  if (!S.labels || S.place!=="links") return;
  ctx.textAlign="center"; ctx.textBaseline="middle";
  for (const k of ORDER){
    // Pushed out past the shell along the band's own direction. Sitting at the hub put the
    // name inside the sphere, where the nodes drew over it.
    const m = (S.bandMid && S.bandMid[k]) || S.hubs[k];
    const len = Math.hypot(m.x,m.y,m.z) || 1, f = (1.30*(m.b||1))/len;
    const P = project({ x:m.x*f, y:m.y*f, z:m.z*f });
    ctx.font = `400 ${Math.round(23*P.d)}px ${C("--serif")}`;
    ctx.fillStyle = `rgba(237,234,227,${.20+P.d*.16})`;
    ctx.fillText(k, P.X, P.Y);
  }
}

function drawLabels(vis, focus, q){
  if (!S.labels) return;
  // NO plate behind the text. A filled rectangle is what makes a label read as a
  // sticker pasted onto the scene; a soft shadow keeps it legible over anything
  // and leaves the background clear.
  const show = [];
  for (const {n,p} of vis){
    if (n===focus){ show.push({n,p}); continue; }
    if (q && q.has(n.name) && q.size<=26){ show.push({n,p}); continue; }
    if (!q && !focus && n.deg>=16 && p.d>0.92) show.push({n,p});
  }
  ctx.textAlign="left"; ctx.textBaseline="middle";
  ctx.shadowColor="rgba(4,5,6,.95)";
  for (const {n} of show){
    const t = n.name.length>38 ? n.name.slice(0,37)+"…" : n.name;
    ctx.font = `500 ${n===focus?12.5:11}px ${C("--sans")}`;
    ctx.shadowBlur = 9;
    ctx.fillStyle = "rgba(4,5,6,.9)";
    ctx.fillText(t, n._X+n._R+8, n._Y);
    ctx.shadowBlur = 0;
    ctx.fillStyle = n===focus ? C("--ink") : "rgba(237,234,227,.82)";
    ctx.fillText(t, n._X+n._R+8, n._Y);
  }
  ctx.shadowBlur = 0;
}

function ring(x,y,r,color,w){
  ctx.beginPath(); ctx.arc(x,y,Math.max(.5,r),0,6.2832);
  ctx.strokeStyle=color; ctx.lineWidth=w; ctx.stroke();
}
const ease = t => 1-Math.pow(1-t,3);
// Long enough to be read as an event rather than a dropped frame, short enough that the graph
// is honest again quickly. Matched to the 1400ms birth so the two read as one pair.
const DEATH_MS = 1500;
function neighbours(n){
  const out=[]; for(const e of S.edges){ if(e.source===n) out.push(e.target); else if(e.target===n) out.push(e.source); }
  return out;
}
function hexa(hex,a){
  const h=hex.replace("#","");
  const b=parseInt(h.length===3?h.split("").map(c=>c+c).join(""):h,16);
  return `rgba(${(b>>16)&255},${(b>>8)&255},${b&255},${a})`;
}

/* --- recall pulses --------------------------------------------------------
   The only place that knows which memories a turn used is the pre-turn hook,
   so it now appends them and this reads that log. A hit lights its node and
   every link leaving it, and names itself in the ticker.                   */
async function pollPulse(){
  try{
    const r = await fetch(`/api/pulse?since=${S.lastPulseAt}`, {cache:"no-store"});
    if(!r.ok){ S.feedOk = false; return; }
    S.feedOk = true;
    const { events } = await r.json();
    // FIRST POLL SEEDS, IT DOES NOT REPLAY. since=0 returns the whole backlog, so opening the
    // page fired a current for every recall ever logged: 22 events times 5 hits was 110 currents
    // landing at once and the orb went solid gold. The history is worth keeping in the counter,
    // never worth animating.
    if (S.lastPulseAt === 0){
      // Seeding never animates, but it must still record WHAT was recalled, or the rail's list
      // of recent memories would be empty until the next recall happened to land while the page
      // was open. Oldest first, so the newest timestamp is the one that sticks on each node.
      for (const ev of (events||[]).slice().sort((a,b)=>a.at-b.at)){
        S.lastPulseAt = Math.max(S.lastPulseAt, ev.at);
        for (const h of ev.hits||[]){
          const n = S.bySlug.get(h.name);
          if (n) n.lastRecall = ev.at;
        }
      }
      paintAgents(events);
      paintRecent();
      return;
    }
    for (const ev of events||[]){
      S.lastPulseAt = Math.max(S.lastPulseAt, ev.at);
      const names = [];
      const from = S.agents.find(a=>a.host === String(ev.host||"")) || S.agents[0];
      const hitNodes = (ev.hits||[]).map(h=>S.bySlug.get(h.name)).filter(Boolean);
      (ev.hits||[]).forEach((h,i)=>{
        const n = S.bySlug.get(h.name);
        if(!n) return;
        names.push(h.name);
        // Staggered, so five hits leave as a sequence in the order they were ranked rather
        // than as one flat flash. The node itself lights on ARRIVAL, inside drawCurrents.
        fireCurrent(from, n, i*190, hitNodes);
      });
    }
    paintAgents(events);
    paintStatus();
    paintRecent();
  }catch{
    // A QUIET BRAIN AND AN UNREACHABLE ONE ARE DIFFERENT FACTS. The owner, 2026-09-15: "on mobile
    // recalls says never". The catch swallowed every failed fetch, so a phone that could load
    // the cached page but not reach the server showed "never since last recall", which reads as
    // "the brain has not been used" when the truth is "this device cannot see the brain".
    S.feedOk = false;
    paintStatus();
  }
}

// One line, always there, always true. It is driven from state rather than from events, so it
// cannot get stuck saying something happened when nothing is happening.
function paintStatus(){
  const el = document.getElementById("status");
  if (!el) return;
  const busy = S.currents.length > 0 || S.nodes.some(n=>n.pulse>0.02);
  const dead = S.feedOk === false;
  el.classList.toggle("live", busy && !dead);
  el.classList.toggle("dead", dead);
  const flashing = Date.now() < flashUntil;
  const st = document.getElementById("stState");
  st.textContent = flashing ? flashText : dead ? "no feed" : busy ? "recalling" : "listening";
  st.classList.toggle("flash", flashing);
  const last = S.lastPulseAt ? Date.now() - S.lastPulseAt : 0;
  document.getElementById("stLast").textContent =
    dead ? "offline" : !S.lastPulseAt ? "never" : ago(last);
  // Only when it is genuinely struggling AFTER the resolution has already been dropped. A frame
  // rate on screen the rest of the time is a developer's readout, not a status.
  const fx = document.getElementById("stFps");
  if (fx){
    const bad = fpsAvg < 30 && DPR <= 1.01;
    fx.textContent = bad ? Math.round(fpsAvg) + " fps" : "";
    fx.style.display = bad ? "" : "none";
  }
  // With machines turned off, or before any recall has ever been logged, "0 of 0 machines" is
  // not a status, it is a column that can only say nothing. Hide it instead.
  const up = S.agents.filter(a=>a.online).length;
  const machOn = CFG.showMachines !== false && S.agents.length > 0;
  document.getElementById("stMach").textContent = up + " of " + S.agents.length;
  for (const el of [document.getElementById("stMach").parentElement,
                    document.getElementById("stMachIco"),
                    document.getElementById("stMachSep")]) {
    if (el) el.style.display = machOn ? "" : "none";
  }
}
function ago(ms){
  const sec = Math.round(ms/1000);
  if (sec < 60) return sec + "s";
  const min = Math.round(sec/60);
  if (min < 60) return min + "m";
  const hr = Math.round(min/60);
  return hr < 48 ? hr + "h" : Math.round(hr/24) + "d";
}
setInterval(paintStatus, 1000);

/* --- the rail's list of memories ------------------------------------------
   The owner, 2026-09-15: "for the Memories part on the side bar, show the latest recall 10 memories".

   It used to list the nine project memories with the most links, which is a fact about the graph
   and never changed. What the brain just USED changes every turn, and the whole point of the
   page is to show the brain being used, so the rail now follows the recalls.

   Sorted by the node's own lastRecall, which the pulse feed writes on both the seed pass and
   every live one, so the list is right the moment the page opens rather than only after a recall
   happens to land while it is watching.                                                      */
function paintRecent(){
  const el = document.getElementById("recent");
  if (!el) return;
  const recent = S.nodes.filter(n=>n.lastRecall).sort((a,b)=>b.lastRecall-a.lastRecall).slice(0,10);
  if (!recent.length){
    el.innerHTML = `<div class="row"><span class="nm" style="color:var(--ink3)">nothing recalled yet</span></div>`;
    return;
  }
  el.innerHTML = recent.map(n=>
    `<div class="row" data-n="${esc(n.name)}"><span class="dot" style="background:${n.color}"></span>`
    + `<span class="nm">${esc(n.name)}</span>`
    + `<span class="sub">${ago(Date.now()-n.lastRecall)}</span></div>`).join("");
  el.querySelectorAll(".row[data-n]").forEach(r=>
    r.addEventListener("click", ()=>select(S.byName.get(r.dataset.n))));
}
// The ages go stale on their own, so they are repainted on the same tick as the status line.
setInterval(paintRecent, 5000);

/* --- creation and deletion: watch the real brain ---------------------------
   The server's signature is the memory count plus the newest mtime, so it changes exactly when
   the folder does and never otherwise. On a change the whole graph is refetched, which is cheap
   at this size and far simpler than a diff protocol, and the page works out what is new and what
   has gone by comparing slugs.                                                               */
async function pollGraph(){
  try{
    const r = await fetch("/api/graph", {cache:"no-store"});
    if(!r.ok) return;
    const g = await r.json();

    // LIVE COUNTS EVERY TICK, whether or not the graph changed, so the header can never drift
    // from the folder it claims to be counting.
    S.counts = { memories:g.counts.memories, links:g.counts.links, facts:g.counts.facts };
    setVital("vN", g.counts.memories);
    setVital("vE", g.counts.links);
    const dm = document.getElementById("demo");
    if (dm) dm.hidden = !g.demo;

    if (!S.sig){ S.sig = g.sig; return; }
    if (g.sig === S.sig) return;
    S.sig = g.sig;

    // What arrived. A new memory comes in with a birth ring and its links draw themselves in one
    // after another: a node that pops into place already wired says nothing, and watching the
    // wiring is the point, because a memory's value is what it connects to.
    let added = 0;
    for (const d of g.nodes){
      if (S.bySlug.has(d.slug)) continue;
      const n = { i:S.nodes.length, slug:d.slug, name:d.name, type:d.type, facts:d.facts,
        deg:0, desc:d.desc||"", region:d.region, color:d.color,
        x:0,y:0,z:0, tx:0,ty:0,tz:0, r:4, phase:Math.random()*6.28, amp:.008,
        pulse:0, born:performance.now(), lastRecall:0 };
      S.nodes.push(n); S.bySlug.set(n.slug, n); S.byName.set(n.name, n); added++;
    }
    let wired = 0;
    if (added){
      const known = new Set(S.edges.map(e=>[e.source.slug,e.target.slug].sort().join(" |> ")));
      for (const [a,b] of g.edges){
        const A = S.bySlug.get(a), B = S.bySlug.get(b);
        if (!A || !B) continue;
        const key = [a,b].sort().join(" |> ");
        if (known.has(key)) continue;
        known.add(key);
        S.edges.push({ source:A, target:B, fresh:true, delay: wired*260 });
        A.deg++; B.deg++; wired++;
      }
      S._meaning = null;                 // the link layout has to be recomputed, it moved
      layout(false);
      setVital("vN", S.nodes.length);
      setVital("vE", S.edges.length);
    }

    // AND WHAT LEFT. Without this the page only ever grows: a deleted memory stays until reload,
    // and a RENAME is a delete plus a create, so it would leave a permanent ghost with no links
    // that looks exactly like a real orphan.
    const live = new Set(g.nodes.map(d=>d.slug));
    // A GUARD, BECAUSE THE ALTERNATIVE FAILS SILENTLY AND TOTALLY. If the read lands mid-write or
    // on a half-built folder, the honest reading of that payload is "every memory was deleted"
    // and the graph would dissolve. Real deletions come a few at a time, so anything larger than
    // a tenth is treated as a bad read and dropped; one reload shows the truth either way.
    const gone = S.nodes.filter(n => !n.dying && !live.has(n.slug));
    if (live.size && gone.length <= Math.max(3, S.nodes.length*0.1)){
      for (const n of gone) n.dying = performance.now();
    } else if (gone.length){
      console.warn("[dashboard] ignoring a read that would remove " + gone.length + " of " + S.nodes.length);
    }
  }catch{ /* offline is not an error either */ }
}

// The second half of a deletion: once the animation has played, the node actually leaves, with
// its edges, its degree contribution on the far end, and anything mid-flight that points at it.
// Run from the frame loop rather than a timer so it can never fire while a paint is half done.
function reap(now){
  const dead = S.nodes.filter(n => n.dying && now - n.dying >= DEATH_MS);
  if (!dead.length) return;
  const set = new Set(dead);
  for (const n of dead){ S.byName.delete(n.name); S.bySlug.delete(n.slug); }
  S.nodes = S.nodes.filter(n => !set.has(n));
  S.edges = S.edges.filter(e => {
    if (!set.has(e.source) && !set.has(e.target)) return true;
    // The survivor loses the degree the dead node was giving it, or the heat map keeps ranking it
    // by links that no longer exist.
    if (!set.has(e.source)) e.source.deg = Math.max(0, e.source.deg-1);
    if (!set.has(e.target)) e.target.deg = Math.max(0, e.target.deg-1);
    return false;
  });
  // Anything already in flight toward a node that no longer exists.
  S.currents = S.currents.filter(c => !set.has(c.node));
  S.live = S.live.filter(l => !(l.nodes||[]).some(n => set.has(n)));
  // If the open panel is describing a memory that just stopped existing, shut it rather than
  // leaving a detail card for something the brain no longer has.
  if (S.selected && set.has(S.selected)) close();
  if (S.hover && set.has(S.hover)) S.hover = null;
  S._meaning = null;                  // the link layout changed, recompute it
  layout(false);
  setVital("vN", S.nodes.length);
  setVital("vE", S.edges.length);
}

/* --- search ------------------------------------------------------------- */
const qEl = document.getElementById("q"), findEl = document.getElementById("find");
qEl.addEventListener("input", ()=>{
  const q = qEl.value.trim().toLowerCase();
  S.query = q;
  if (!q){ S.matches=null; findEl.classList.remove("has"); document.getElementById("qn").textContent=""; return; }
  const hit = new Set();
  for (const n of S.nodes){
    if (n.name.toLowerCase().includes(q) || n.desc.toLowerCase().includes(q)) hit.add(n.name);
  }
  S.matches = hit;
  findEl.classList.add("has");
  document.getElementById("qn").textContent = hit.size ? `${hit.size} found` : "none";
});
addEventListener("keydown", e=>{
  if (e.key==="/" && document.activeElement!==qEl){ e.preventDefault(); qEl.focus(); }
  if (e.key==="Escape"){
    if(document.activeElement===qEl){ qEl.value=""; qEl.dispatchEvent(new Event("input")); qEl.blur(); }
    else { close(); S.expanded=null; S.sats=[]; }
  }
});

/* --- interaction -------------------------------------------------------- */
/* --- gestures -----------------------------------------------------------
   One pointer turns the ball. TWO pointers pinch to zoom and drag to pan, and
   deliberately do not rotate: a pinch that also spins the scene is the single
   most disorienting thing a 3D view can do on a touch screen.

   Pointer events, not touch events, so a mouse, a pen, a trackpad and a finger
   all arrive on the same path and there is one set of behaviour to get right. */
const midOf = () => {
  const ps = [...S.pointers.values()];
  return { x:(ps[0].x+ps[1].x)/2, y:(ps[0].y+ps[1].y)/2,
           d:Math.hypot(ps[0].x-ps[1].x, ps[0].y-ps[1].y) };
};

cv.addEventListener("pointerdown", e=>{
  cancelGlide();
  cv.setPointerCapture(e.pointerId);
  S.pointers.set(e.pointerId, { x:e.offsetX, y:e.offsetY });
  S.inertia = null;
  if (S.pointers.size === 1){
    S.drag = { p:ballPoint(e.offsetX, e.offsetY), moved:0 };
    S.gesture = null;
  } else if (S.pointers.size === 2){
    S.drag = null;                       // a second finger ends the turn
    const m = midOf();
    S.gesture = { d:m.d, x:m.x, y:m.y, zoom:S.zoom };
  }
  cv.classList.add("drag");
});

cv.addEventListener("pointermove", e=>{
  if (S.pointers.has(e.pointerId)) S.pointers.set(e.pointerId, { x:e.offsetX, y:e.offsetY });

  if (S.pointers.size >= 2 && S.gesture){
    const m = midOf();
    if (m.d > 8 && S.gesture.d > 8) zoomAt(S.gesture.zoom * (m.d/S.gesture.d), m.x, m.y);
    S.panX += m.x - S.gesture.x;
    S.panY += m.y - S.gesture.y;
    S.gesture.x = m.x; S.gesture.y = m.y;
    S.gesture.d = m.d; S.gesture.zoom = S.zoom;
    return;
  }
  if (S.drag){
    const p = ballPoint(e.offsetX, e.offsetY);
    const dq = qBetween(S.drag.p, p);
    // Applied 1:1 and immediately. A trackball that lags is a trackball you fight; the weight
    // belongs in the release, not in the grab.
    S.q = qNorm(qMul(dq, S.q));
    S.drag.moved += Math.hypot(p[0]-S.drag.p[0], p[1]-S.drag.p[1]) * 260;
    S.drag.p = p;
    S.inertia = dq;
    return;
  }
  S.hover = pick(e.offsetX, e.offsetY);
});

function endPointer(e){
  S.pointers.delete(e.pointerId);
  const moved = S.drag ? S.drag.moved : 99;
  const wasGesture = !!S.gesture;
  if (S.pointers.size < 2) S.gesture = null;
  // Lifting one finger of a pinch must not become a fling of the ball.
  if (S.pointers.size === 1 && !S.drag){
    const only = [...S.pointers.values()][0];
    S.drag = { p:ballPoint(only.x, only.y), moved:99 };
    return;
  }
  if (S.pointers.size === 0){
    S.drag = null; cv.classList.remove("drag");
    if (moved < 5 && !wasGesture){
      S.inertia = null;                   // a tap is not a throw
      const n = pick(e.offsetX, e.offsetY);
      if (n){ select(n); if (!n.host && n !== S.core) expand(n); }
      else { close(); S.expanded=null; S.sats=[]; }
    }
  }
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);

cv.addEventListener("wheel", e=>{
  cancelGlide();
  e.preventDefault();
  // ctrl+wheel is what a trackpad pinch sends. Both zoom, the pinch just harder.
  const factor = Math.exp(-e.deltaY * (e.ctrlKey ? 0.012 : 0.0022));
  zoomAt(S.zoom * factor, e.offsetX, e.offsetY);
}, {passive:false});

// Free orbit with no landmark means you can always get lost, and on a touch screen there is no
// double click. The buttons are the reliable way back and the reliable way in.
cv.addEventListener("dblclick", resetView);
// Reset returns to where THIS visit started, not to a canonical angle. Reset means undo what I
// did, and sending someone to an orientation they have never seen is not that.
/* --- the camera glide -----------------------------------------------------
   The owner, 2026-09-15: "make the zoom in and zoom out and centre animation smooth".

   The buttons moved the camera by assignment, so a tap was a cut: the scene was somewhere else
   on the very next frame and you had to find your place again. Direct input stays instant on
   purpose, because a wheel or a pinch is tracking your hand and any easing there reads as lag.
   A button is not tracking anything, so it gets the ease.

   Centre also has to turn, not only zoom: it restores the home rotation, and interpolating a
   quaternion linearly would swing the ball wide and change its speed halfway. Slerp keeps the
   turn on the shortest arc at a constant rate.                                              */
let cam = null;
const easeIO = (t) => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;

function qSlerp(a, b, t){
  let B = b, d = a[0]*b[0] + a[1]*b[1] + a[2]*b[2] + a[3]*b[3];
  // Two quaternions describe every rotation. Taking the near one keeps the turn short.
  if (d < 0){ B = [-b[0],-b[1],-b[2],-b[3]]; d = -d; }
  if (d > 0.9995) return qNorm([a[0]+(B[0]-a[0])*t, a[1]+(B[1]-a[1])*t,
                                a[2]+(B[2]-a[2])*t, a[3]+(B[3]-a[3])*t]);
  const th0 = Math.acos(d), th = th0*t, s0 = Math.sin(th0);
  const s1 = Math.sin(th0-th)/s0, s2 = Math.sin(th)/s0;
  return qNorm([a[0]*s1+B[0]*s2, a[1]*s1+B[1]*s2, a[2]*s1+B[2]*s2, a[3]*s1+B[3]*s2]);
}

function glide(to, ms){
  cam = { t0: performance.now(), dur: ms,
    from: { zoom:S.zoom, panX:S.panX, panY:S.panY, q:[...S.q] },
    to: { zoom: to.zoom===undefined ? S.zoom : to.zoom,
          panX: to.panX===undefined ? S.panX : to.panX,
          panY: to.panY===undefined ? S.panY : to.panY,
          q: to.q ? [...to.q] : null } };
}
function stepCam(now){
  if (!cam) return;
  const k = Math.min(1, (now - cam.t0)/cam.dur), e = easeIO(k);
  S.zoom = cam.from.zoom + (cam.to.zoom - cam.from.zoom)*e;
  S.panX = cam.from.panX + (cam.to.panX - cam.from.panX)*e;
  S.panY = cam.from.panY + (cam.to.panY - cam.from.panY)*e;
  if (cam.to.q) S.q = qSlerp(cam.from.q, cam.to.q, e);
  if (k >= 1) cam = null;
}
// Any hand on the scene wins immediately. A glide that fought a drag would feel like the page
// was arguing with the finger.
function cancelGlide(){ cam = null; }

function resetView(){
  S.inertia = null;
  glide({ zoom:1, panX:0, panY:0, q: S.home ? [...S.home] : randomView() }, 900);
}
function nudgeZoom(f){
  // Chain off the PENDING target, not the current position, so three quick taps compound to
  // three steps instead of restarting from wherever the last glide had got to.
  const base = cam ? cam.to : S;
  const z0 = base.zoom, z1 = Math.max(0.45, Math.min(18, z0*f));
  if (z1 === z0) return;
  const r = z1/z0;
  glide({ zoom:z1, panX: base.panX*r, panY: base.panY*r }, 420);
}
document.getElementById("zIn").addEventListener("click", ()=>nudgeZoom(1.45));
document.getElementById("zOut").addEventListener("click", ()=>nudgeZoom(1/1.45));
document.getElementById("zRst").addEventListener("click", resetView);

function pick(x,y){
  // Core and agents first: they are small, they sit in front, and they are what someone is
  // aiming at when they click near the middle.
  for (const a of S.agents){
    if (a._X===undefined) continue;
    if ((a._X-x)**2+(a._Y-y)**2 < (a._R+11)**2) return a;
  }
  if (S.core._X!==undefined && (S.core._X-x)**2+(S.core._Y-y)**2 < (S.core._R+9)**2) return S.core;
  let best=null, bd=Infinity;
  for (const n of S.nodes){
    if (n._X===undefined) continue;
    const d=(n._X-x)**2+(n._Y-y)**2, hit=(n._R+9)**2;
    if (d<hit && d<bd){ bd=d; best=n; }
  }
  return best;
}

const panel=document.getElementById("panel");
function select(n){
  if(!n) return;
  // An agent or the core is not a memory: it has no facts, no links and no region, so the
  // panel shows what it DOES have rather than a row of zeroes.
  if (n.host || n === S.core){
    S.selected=null;
    const isCore = n === S.core;
    document.getElementById("pKind").textContent = isCore ? (CFG.tagline||"the brain") : (n.online ? "machine, active" : "machine, quiet");
    document.getElementById("pName").textContent = isCore ? S.core.name : n.host;
    const C0 = S.counts || { memories:S.nodes.length, links:S.edges.length,
      facts:S.nodes.reduce((a,x)=>a+(x.facts||0),0), full:null };
    const full = C0.full || (5 + C0.memories + C0.facts);
    // The owner, 2026-09-15: "why does it say we have 22000 nodes but only 400 memories?" Because a
    // node in that number is not a memory, it is one LINE of one memory, and the label said
    // "nodes in full", which reads as memories. Say what the unit is, in the panel, so the
    // question does not need asking twice.
    document.getElementById("pDesc").textContent = isCore
      ? `${fmt(C0.memories)} memories holding ${fmt(C0.facts)} facts between them. A fact is one `
        + `line of one memory, so drawing every one at once would be ${fmt(full)} dots. Nothing `
        + `is hidden: open a memory and its facts appear around it.`
      : `${n.recalls ? n.recalls + (n.recalls===1?" recall":" recalls") + " logged from this machine" : "no recalls logged here yet"}.`;
    // Facts, links, then the big number in the third slot, which is where the dead
    // "-- last recalled" used to sit. The core has never been recalled, so that slot was always
    // a dash: a column that can only ever say nothing is worse than no column.
    document.getElementById("pFacts").textContent = isCore ? fmt(C0.facts) : (n.recalls||0);
    document.getElementById("pLinks").textContent = isCore ? fmt(C0.links) : (n.online?"up":"down");
    document.getElementById("pFactsL").textContent = isCore ? "facts" : "recalls";
    document.getElementById("pLinksL").textContent = isCore ? "links" : "state";
    document.getElementById("pSeenL").textContent = isCore ? "facts as dots" : "last recalled";
    document.getElementById("pSeen").textContent = isCore ? fmt(full)
      : (n.lastRecall ? new Date(n.lastRecall).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : "--");
    document.getElementById("pLinksList").innerHTML = "";
    panel.classList.add("open");
    return;
  }
  S.selected=n;
  document.getElementById("pFactsL").textContent = "facts";
  document.getElementById("pLinksL").textContent = "links";
  document.getElementById("pSeenL").textContent = "last recalled";
  document.getElementById("pKind").textContent = n.region;
  document.getElementById("pName").textContent = n.name;
  document.getElementById("pDesc").textContent = n.desc;
  document.getElementById("pFacts").textContent = n.facts;
  document.getElementById("pLinks").textContent = n.deg;
  document.getElementById("pSeen").textContent = n.lastRecall
    ? new Date(n.lastRecall).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : "--";
  const list=document.getElementById("pLinksList");
  list.innerHTML = neighbours(n).sort((a,b)=>b.deg-a.deg).map(m=>
    `<a data-n="${esc(m.name)}"><i style="background:${m.color}"></i>${esc(m.name)}</a>`).join("");
  list.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{
    const t=S.byName.get(a.dataset.n); select(t); expand(t);
  }));
  panel.classList.add("open");
}
function close(){ S.selected=null; panel.classList.remove("open"); }
document.getElementById("px").addEventListener("click", ()=>{ close(); S.expanded=null; S.sats=[]; });

document.querySelectorAll(".seg button[data-p]").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".seg button[data-p]").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); S.place=b.dataset.p; layout(false);
}));
// One handler, two toggles, keyed by the attribute value. It used to flip S.spin whatever the
// button said, so a second [data-t] button would have silently been a second drift switch.
document.querySelectorAll(".seg button[data-t]").forEach(b=>b.addEventListener("click",()=>{
  const k = b.dataset.t;
  S[k] = !S[k];
  b.classList.toggle("on", !!S[k]);
  syncBar();
}));

// The rail as a sheet on a phone. Opening it must not leave the graph mid-gesture.
const aside = document.getElementById("aside");
const closeSheet = ()=> aside.classList.remove("open");
document.getElementById("menubtn").addEventListener("click", ()=>{
  aside.classList.toggle("open");
  S.pointers.clear(); S.drag=null; S.gesture=null;
});
document.getElementById("sheetclose").addEventListener("click", closeSheet);
document.getElementById("saveImg").addEventListener("click", ()=>{ closeSheet(); saveImage(); });
document.getElementById("toggleNames").addEventListener("click", ()=>{
  document.querySelector('.dock [data-t="labels"]').click();
});

/* --- the phone control bar ------------------------------------------------
   The owner, 2026-09-15: "I need the mobile ui fixed, use Icon instead of text".

   Each icon FORWARDS to the control that already exists rather than repeating its logic. A second
   implementation of the mode switch would be a second thing to keep in step, and the one that is
   only reachable on a phone is the one that would silently rot. The cost is a click() hop, which
   is free; the benefit is that a phone and a desktop can never disagree about what a button does.

   State is mirrored FROM the real controls, never held here, for the same reason.              */
const tabbar = document.getElementById("tabbar");
const seg = (sel) => document.querySelector(".dock " + sel);
const ACT = {
  menu:   () => document.getElementById("menubtn").click(),
  links:  () => seg('[data-p="links"]').click(),
  meaning:() => seg('[data-p="meaning"]').click(),
  spin:   () => seg('[data-t="spin"]').click(),
  labels: () => seg('[data-t="labels"]').click(),
  zin:    () => document.getElementById("zIn").click(),
  zout:   () => document.getElementById("zOut").click(),
  reset:  () => document.getElementById("zRst").click(),
  search: () => {
    const on = document.body.classList.toggle("searching");
    if (on) { setTimeout(()=>qEl.focus(), 60); return; }
    // Closing the field has to clear the filter too, or the graph stays dimmed to a search the
    // user can no longer see.
    qEl.value = ""; qEl.dispatchEvent(new Event("input", {bubbles:true})); qEl.blur();
  },
};
function syncBar(){
  const set = (act, on) => { const b = tabbar.querySelector('[data-act="'+act+'"]'); if (b) b.classList.toggle("on", !!on); };
  set("links",  S.place === "links");
  set("meaning", S.place === "meaning");
  set("spin",   !!S.spin);
  set("labels", !!S.labels);
  const ns = document.getElementById("namesSub"); if (ns) ns.textContent = S.labels ? "on" : "off";
  set("menu",   document.getElementById("aside").classList.contains("open"));
  set("search", document.body.classList.contains("searching"));
}
tabbar.addEventListener("click", (e)=>{
  const b = e.target.closest("button"); if (!b) return;
  const fn = ACT[b.dataset.act]; if (fn) fn();
  syncBar();
});
// The sheet and the search also close by other routes (the grab handle, Escape), so the bar is
// re-synced on the status tick rather than trusting every path to remember to call it.
setInterval(syncBar, 700);
syncBar();
// Anything chosen from the sheet closes it, or the thing you picked is behind it.
aside.addEventListener("click", (e)=>{ if (e.target.closest(".row")) closeSheet(); });
</script>
</body>
